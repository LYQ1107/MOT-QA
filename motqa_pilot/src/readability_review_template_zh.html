<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MOT-QA 修订补审12题 · 中文版</title><style>body{margin:0;background:#edf3f7;color:#153347;font:17px/1.65 system-ui}main{max-width:1240px;margin:auto;padding:20px}header,section{background:white;border:1px solid #c5d7e4;border-radius:10px;padding:20px;margin-bottom:18px}h1{font-size:25px}h2{font-size:21px}button,select,textarea{font:inherit;border:1px solid #9ab4c7;border-radius:5px;background:white;padding:8px;margin:4px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}img{max-width:100%;max-height:480px;object-fit:contain}video{width:100%;max-height:650px;background:#10212c}.option{border:1px solid #cedde5;border-radius:5px;padding:10px;margin:8px 0}.minor{font-size:14px;color:#526c7d}.notice{padding:12px;background:#fff3d9;border-left:4px solid #dc9b21}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:96%;box-sizing:border-box}.samplegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}</style><main><header><h1>MOT-QA 修订补审12题 · 中文版</h1><p>这次审核修订后的题目。前3题分别替换原0225、0229、0777；其余检查同类问题。已通过且未修改的题无需重审。</p><p>请判断：人物能否确定、事件是否清楚、问题与答案是否一致。肉眼仍难判断时请选择“不确定”。GT仅供核验。</p><div id="progress"></div><button onclick="step(-1)">上一题</button><button onclick="step(1)">下一题</button><button onclick="exportJSON()">导出12题审阅结果</button><button onclick="document.getElementById('import').click()">导入继续</button><input type=file id=import accept="application/json" hidden></header><section id="body"></section></main><script>const packet=__PACKET__;let i=0;const K=packet.packet_id;let state=JSON.parse(localStorage.getItem(K)||'{}');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(state));}function progress(){document.getElementById('progress').textContent=`第 ${i+1}/${packet.count} 题；已标记 ${Object.values(state).filter(x=>x.verdict).length}/${packet.count}`;}function render(){const q=packet.questions[i],s=state[q.qa_id]||{};progress();const refs=q.reference.persons.map(r=>`<div><b>人物 ${esc(r.role)}</b><p>${esc(r.text_zh)}</p><p class=minor>参考图时刻：${r.t_ref_s.toFixed(3)}秒${r.event_time_s!=null?`；指代事件：${r.event_time_s.toFixed(3)}秒`:''}</p><img src="${esc(r.image)}"><p>3倍目标裁剪图</p><img src="${esc(r.zoom_crop)}"></div>`).join('');let options=Object.entries(q.options).map(([k,v])=>`<div class=option>${k}：${q.option_images?'人物裁剪图':esc(q.options_zh[k]||v)}${q.option_images?`<br><img src="${esc(q.option_images[k])}">`:''}</div>`).join('');if(q.format.startsWith('numeric'))options=`<p>作答形式：${q.format==='numeric_time'?'时间，单位秒，容差±0.5秒':'精确整数人数'}。</p>`;const ans=q.format.startsWith('numeric')?(q.format==='numeric_time'?Number(q.answer).toFixed(3):q.answer):q.answer+'：'+(q.option_images?'对应人物裁剪图':q.options_zh[q.answer]||q.options[q.answer]);const facts=q.readability_v3.gap_checks.map(z=>`人物 ${q.evidence.role_mapping[String(z.gt_id)]||'目标'}：最后可见 ${((z.last-1)/q.fps).toFixed(3)}秒；间断 ${z.duration_s.toFixed(3)}秒；重新可见 ${((z.return-1)/q.fps).toFixed(3)}秒。实际32帧中，间断内有${z.sampled_missing_times_s.length}帧。`).join('\n');document.getElementById('body').innerHTML=`<h2>补审 ${i+1}/${packet.count} · ${esc(q.operation_name)} · ${esc(q.dataset)}</h2><p class=minor>新题：${esc(q.qa_id)}；对应旧题：${esc(q.previous_slot_qa_id)}；视频：${esc(q.sequence)}</p><div class=notice>${q.change_reasons_zh.map(esc).join('；')}</div><details><summary>展开旧版对照</summary><p>${esc(q.old_version.dataset)} / ${esc(q.old_version.sequence)}</p><p>${esc(q.old_version.question_zh)}</p>${q.old_version.reference_texts_zh.map(t=>`<p>${esc(t)}</p>`).join('')}</details><h2>当前修订版：人物指代</h2><div class=grid>${refs}</div><h2>${esc(q.question_zh)}</h2><details><summary>英文题面原文（核对用）</summary><p>${esc(q.question)}</p></details>${q.query_image?`<h3>查询帧（${q.query_time_s.toFixed(3)}秒）</h3><img src="${esc(q.query_image)}">`:''}${options}<h3>原片与GT核验片段</h3><select id=version><option value=raw_clip>原片</option><option value=gt_clip>GT核验片段</option></select><video id=video controls preload=metadata src="${esc(q.media.raw_clip)}"></video><p class=minor>原视频 ${q.media.clip_start_s.toFixed(3)}–${q.media.clip_end_s.toFixed(3)}秒。秒数保留原视频时间；GT框仅供核验。</p><details><summary>查看模型实际使用的32帧与时间戳</summary><img style="max-height:none" src="${esc(q.media.actual32_overview)}"><div class=samplegrid>${q.media.actual32.map(f=>`<div><p>${f.time_s.toFixed(3)}秒</p><img src="${esc(f.image)}"></div>`).join('')}</div></details><details><summary>展开答案与GT事实核验</summary><p><b>${esc(ans)}</b></p><pre>${esc(facts)}</pre><pre>${esc(JSON.stringify(q.evidence.gt_detail,null,2))}</pre><div class=grid>${q.media.frames.map(f=>`<div><p>${f.time_s.toFixed(3)}秒</p><img src="${esc(f.image)}"></div>`).join('')}</div></details><h3>你的审核结果</h3><div>${[['pass','通过'],['fail','不通过'],['uncertain','不确定']].map(([v,t])=>`<label><input type=radio name=verdict value=${v} ${s.verdict===v?'checked':''}>${t}</label>`).join('　')}</div><textarea id=notes placeholder="请写下人物指代、事件可见性或答案的问题">${esc(s.notes||'')}</textarea>`;document.getElementById('version').onchange=e=>document.getElementById('video').src=q.media[e.target.value];document.querySelectorAll('[name=verdict]').forEach(x=>x.onchange=e=>{state[q.qa_id]={...(state[q.qa_id]||{}),verdict:e.target.value};save();progress()});document.getElementById('notes').oninput=e=>{state[q.qa_id]={...(state[q.qa_id]||{}),notes:e.target.value};save()};}function step(d){i=Math.max(0,Math.min(packet.count-1,i+d));render();window.scrollTo(0,0)}function exportJSON(){const out={packet_id:packet.packet_id,exported_at:new Date().toISOString(),total:packet.count,reviews:packet.questions.map(q=>({qa_id:q.qa_id,verdict:state[q.qa_id]?.verdict||null,notes:state[q.qa_id]?.notes||''}))};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='stage3_readability_v3_review_result.json';a.click();URL.revokeObjectURL(a.href)}document.getElementById('import').onchange=async e=>{const out=JSON.parse(await e.target.files[0].text());if(out.packet_id!==packet.packet_id)throw Error('补审题包不匹配');state=Object.fromEntries(out.reviews.map(x=>[x.qa_id,{verdict:x.verdict,notes:x.notes}]));save();render()};render();</script></html>
